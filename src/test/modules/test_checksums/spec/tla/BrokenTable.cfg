\* A deliberately broken run: the on -> off shortcut added to
\* checksum_barriers[], which is what lean/Spec/Safety.lean's
\* onOff_shortcut_unsafe rules out.  Here it is executable, and TLC prints
\* the interleaving.
\*
\*     java -cp tla2tools.jar tlc2.TLC -config BrokenTable.cfg DataChecksums
\*
\* Expect "Error: Invariant WriteSafe is violated." with a three-state trace:
\* the coordinator goes straight from on to off, one process picks up the new
\* state and stops writing checksums, and the other is still verifying them.
\*
\* TableAudit is deliberately not listed.  It also fails under this variant --
\* statically, before any transition is taken, which is the Lean theorem --
\* and listing it would pre-empt the trace this configuration exists to show.

SPECIFICATION Spec

CONSTANTS
    Backends = { b1, b2 }
    Pages    = { p1 }
    Variant  = "brokenTable"

INVARIANTS
    WriteSafe
    ReadSafe
