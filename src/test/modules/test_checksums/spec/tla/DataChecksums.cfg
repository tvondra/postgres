\* The main run: safety, the barrier table audit, and liveness.
\*
\*     java -cp tla2tools.jar tlc2.TLC DataChecksums
\*
\* Expect "Model checking completed. No error has been found." after a few
\* hundred states.  Raising Backends to four and Pages to three is still
\* instant, if you want more reassurance than the Lean proof already gives.

SPECIFICATION Spec

CONSTANTS
    Backends = { b1, b2, b3 }
    Pages    = { p1, p2 }
    Variant  = "none"

INVARIANTS
    TypeOK
    TableAudit
    WriteSafe
    ReadSafe
    NoSpuriousFailure

PROPERTIES
    BarrierRetires
