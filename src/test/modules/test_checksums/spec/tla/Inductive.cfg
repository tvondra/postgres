\* A cross-check of the Lean proof rather than of the C code.
\*
\*     java -cp tla2tools.jar tlc2.TLC -config Inductive.cfg DataChecksums
\*
\* Using Inv as the initial predicate makes TLC start from *every* state
\* satisfying it, not just the reachable ones, and confirm that each
\* transition preserves it.  That is exactly the obligation discharged by
\* lean/Spec/Safety.lean's Inv.step, so a failure here means the Lean
\* invariant and the transcription below have drifted apart.
\*
\* Expect a search depth of 1: every successor of an Inv state is already an
\* Inv state, which is what "inductive" means.

INIT Inv
NEXT Next

CONSTANTS
    Backends = { b1, b2, b3 }
    Pages    = { p1, p2 }
    Variant  = "none"

INVARIANTS
    Inv
    WriteSafe
