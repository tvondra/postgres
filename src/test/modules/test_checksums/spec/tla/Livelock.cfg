\* The other deliberately broken run, and the one that justifies having a
\* model checker at all: the coordinator drives an edge that is not in
\* checksum_barriers[].
\*
\*     java -cp tla2tools.jar tlc2.TLC -config Livelock.cfg DataChecksums
\*
\* Expect "Error: Temporal properties were violated." with a lasso in which
\* one process is left behind for ever: it cannot absorb the barrier, so
\* AbsorbDataChecksumsBarrier() raises an error, procsignal resets the bit and
\* retries, and WaitForProcSignalBarrier() in the coordinator never returns.
\*
\* Only the temporal property is listed, because this variant violates
\* WriteSafe too -- see the README -- and TLC checks invariants first.

SPECIFICATION Spec

CONSTANTS
    Backends = { b1, b2 }
    Pages    = { p1 }
    Variant  = "livelock"

PROPERTIES
    BarrierRetires
